<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Products CRUD</title>
  <style>
    body{font-family:Arial;margin:20px}
    .error{color:#9b1c1c;background:#fff1f2;padding:10px;border-radius:6px;margin-bottom:10px}
    .success{color:#064e3b;background:#ecfdf5;padding:10px;border-radius:6px;margin-bottom:10px}
    table{width:100%;border-collapse:collapse;margin-top:10px}
    th,td{border:1px solid #ddd;padding:8px}
    form{margin-top:12px;padding:10px;border:1px solid #eee;border-radius:6px}
  </style>
</head>
<body>
  <h1>Products CRUD</h1>
  <div id="message"></div>

  <table>
    <thead><tr><th>ID</th><th>Name</th><th>Code</th><th>Email</th><th>BirthDate</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead>
    <tbody id="rows"><tr><td colspan="8">Loading...</td></tr></tbody>
  </table>

  <form id="productForm" novalidate>
    <input type="hidden" id="id" />
    <label>Name <input id="name" required minlength="3" maxlength="50" /></label><br/>
    <label>Email <input id="email" type="email" required /></label><br/>
    <label>Birth date <input id="birthDate" type="date" max="{{ today }}" required /></label><br/>
    <label>Code <input id="code" pattern="[A-Za-z0-9-]{4,20}" required /></label><br/>
    <label>Price <input id="price" type="number" step="0.01" min="0.01" required /></label><br/>
    <label>Stock <input id="stock" type="number" step="1" min="0" value="0" /></label><br/>
    <button type="submit">Save</button>
    <button type="button" id="resetBtn">Reset</button>
  </form>

  <script>
    const API = "/products";
    const msgEl = document.getElementById("message");
    const rows = document.getElementById("rows");
    const form = document.getElementById("productForm");
    const idEl = document.getElementById("id");
    const nameEl = document.getElementById("name");
    const emailEl = document.getElementById("email");
    const birthEl = document.getElementById("birthDate");
    const codeEl = document.getElementById("code");
    const priceEl = document.getElementById("price");
    const stockEl = document.getElementById("stock");

    function show(type, text){
      msgEl.innerHTML = `<div class="${type==='error'?'error':'success'}">${text}</div>`;
      setTimeout(()=>msgEl.innerHTML="",5000);
    }

    async function load(){
      const r = await fetch(API);
      const data = await r.json();
      if (!data.length) rows.innerHTML = '<tr><td colspan="8">No products</td></tr>';
      else rows.innerHTML = data.map(p=>`<tr>
        <td>${p.id}</td><td>${p.name}</td><td>${p.code||p.sku||''}</td><td>${p.email||''}</td><td>${p.birth_date||''}</td><td>${Number(p.price).toFixed(2)}</td><td>${p.stock}</td>
        <td><button onclick="edit(${p.id})">Edit</button> <button onclick="del(${p.id})">Delete</button></td></tr>`).join('');
    }

    async function edit(id){
      const r = await fetch(`${API}/${id}`);
      if (r.status===404){ show('error','Not found'); return; }
      const p = await r.json();
      idEl.value=p.id; nameEl.value=p.name; emailEl.value=p.email||''; birthEl.value=p.birth_date||''; codeEl.value=p.code||p.sku||''; priceEl.value=p.price; stockEl.value=p.stock;
    }

    async function del(id){
      if(!confirm('Delete?')) return;
      const r = await fetch(`${API}/${id}`, {method:'DELETE'});
      if (r.status===404) show('error','Not found');
      else if (!r.ok) show('error','Delete failed');
      else { show('success','Deleted'); load(); }
    }

    form.addEventListener("submit", async e=>{
      e.preventDefault();
      if (!form.checkValidity()){ form.reportValidity(); return; }
      const payload = {
        name: nameEl.value.trim(),
        email: emailEl.value.trim(),
        birthDate: birthEl.value,
        code: codeEl.value.trim(),
        price: parseFloat(priceEl.value),
        stock: parseInt(stockEl.value || "0",10)
      };
      const id = idEl.value;
      const res = await fetch(id? `${API}/${id}`: API, {
        method: id? "PUT":"POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      });
      const body = await res.json().catch(()=>null);
      if (!res.ok){
        if (body && body.fieldErrors){
          show('error', body.fieldErrors.map(f=>`${f.field}: ${f.message}`).join('; '));
        } else {
          show('error', `Error ${res.status}`);
        }
        return;
      }
      show('success', id? 'Updated':'Created');
      form.reset(); idEl.value=""; load();
    });

    document.getElementById("resetBtn").addEventListener("click", ()=>{ form.reset(); idEl.value=""; });

    load();
  </script>
</body>
</html>
