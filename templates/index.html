<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Products CRUD</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 20px; color: #222 }
    h1 { margin-bottom: 8px }
    .container { max-width: 1000px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: 1fr 360px; gap: 20px; align-items: start; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff }
    th, td { padding: 8px 10px; border: 1px solid #e0e0e0; text-align: left; font-size: 14px }
    th { background: #f7f7f7; font-weight: 600 }
    tr:nth-child(even) td { background: #fafafa }
    form { background: #fff; padding: 12px; border: 1px solid #e0e0e0; border-radius: 6px }
    input[type="text"], input[type="number"] { width: 100%; padding: 8px; margin: 6px 0 12px 0; box-sizing: border-box }
    label { font-size: 13px; display:block; margin-top:6px }
    button { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer }
    .btn-primary { background: #2563eb; color: #fff }
    .btn-ghost { background: #f3f4f6; color: #111; border: 1px solid #ddd }
    .actions button { margin-right:6px }
    .meta { font-size: 12px; color: #666 }
    .msg { padding: 8px 10px; border-radius:6px; margin-bottom:10px }
    .msg.success { background:#ecfdf5; color:#065f46; border:1px solid #bbf7d0 }
    .msg.error { background:#fff1f2; color:#9f1239; border:1px solid #fecaca }
    .loader { display:inline-block; width:16px; height:16px; border:2px solid #cbd5e1; border-top-color:#2563eb; border-radius:50%; animation: spin .8s linear infinite; vertical-align:middle; margin-left:8px }
    @keyframes spin { to { transform: rotate(360deg) } }
    .small { font-size: 13px }
    .note { margin-top:8px; color:#555; font-size:13px }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>Products CRUD</h1>
    <div class="note">Use the form to add or edit products. All actions call the REST API.</div>

    <div id="message"></div>

    <div class="grid">
      <div>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>SKU</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Created</th>
              <th>Updated</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="8" class="small meta">Loading...</td></tr>
          </tbody>
        </table>
      </div>

      <div>
        <form id="product-form" novalidate>
          <input type="hidden" id="product-id" />
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required />

          <label for="sku">SKU</label>
          <input id="sku" name="sku" type="text" required />

          <label for="price">Price</label>
          <input id="price" name="price" type="number" step="0.01" min="0" required />

          <label for="stock">Stock</label>
          <input id="stock" name="stock" type="number" step="1" min="0" value="0" />

          <div style="display:flex; gap:8px; margin-top:8px">
            <button id="submit-btn" class="btn-primary" type="submit">Add</button>
            <button id="reset-btn" type="button" class="btn-ghost">Reset</button>
            <div id="busy" style="margin-left:auto; display:flex; align-items:center"></div>
          </div>
        </form>

        <div style="margin-top:12px">
          <div class="meta">Tip: click Edit to load product into the form. While editing click Reset to cancel.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "/products";
    const rowsEl = document.getElementById("rows");
    const form = document.getElementById("product-form");
    const idEl = document.getElementById("product-id");
    const nameEl = document.getElementById("name");
    const skuEl = document.getElementById("sku");
    const priceEl = document.getElementById("price");
    const stockEl = document.getElementById("stock");
    const submitBtn = document.getElementById("submit-btn");
    const resetBtn = document.getElementById("reset-btn");
    const messageEl = document.getElementById("message");
    const busyEl = document.getElementById("busy");

    function showMessage(text, type = "success") {
      messageEl.innerHTML = `<div class="msg ${type === "error" ? "error" : "success"}">${text}</div>`;
      setTimeout(() => { if (messageEl.innerHTML) messageEl.innerHTML = ""; }, 4000);
    }

    function setBusy(on) {
      busyEl.innerHTML = on ? '<span class="loader"></span>' : '';
      submitBtn.disabled = on;
      resetBtn.disabled = on;
    }

    function formatDate(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      return d.toLocaleString();
    }

    async function fetchProducts() {
      setBusy(true);
      try {
        const res = await fetch(API_BASE);
        if (!res.ok) throw new Error(`Failed to load (${res.status})`);
        const data = await res.json();
        renderRows(data);
      } catch (err) {
        rowsEl.innerHTML = `<tr><td colspan="8" class="small meta">Error loading: ${err.message}</td></tr>`;
        showMessage(`Error loading products: ${err.message}`, "error");
      } finally {
        setBusy(false);
      }
    }

    function renderRows(items) {
      if (!items.length) {
        rowsEl.innerHTML = '<tr><td colspan="8" class="meta small">No products yet</td></tr>';
        return;
      }
      rowsEl.innerHTML = items.map(p => `
        <tr>
          <td>${p.id}</td>
          <td>${escapeHtml(p.name)}</td>
          <td>${escapeHtml(p.sku)}</td>
          <td>${Number(p.price).toFixed(2)}</td>
          <td>${p.stock}</td>
          <td class="small">${formatDate(p.created_at)}</td>
          <td class="small">${formatDate(p.updated_at)}</td>
          <td class="actions">
            <button class="btn-ghost" onclick="onEdit(${p.id})">Edit</button>
            <button class="btn-ghost" onclick="onDelete(${p.id})">Delete</button>
          </td>
        </tr>`).join("");
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[s]));
    }

    async function onEdit(id) {
      setBusy(true);
      try {
        const res = await fetch(`${API_BASE}/${id}`);
        if (res.status === 404) { showMessage("Product not found", "error"); return; }
        if (!res.ok) throw new Error(`Load failed (${res.status})`);
        const p = await res.json();
        idEl.value = p.id;
        nameEl.value = p.name;
        skuEl.value = p.sku;
        priceEl.value = p.price;
        stockEl.value = p.stock;
        submitBtn.textContent = "Save";
      } catch (err) {
        showMessage(`Cannot load product: ${err.message}`, "error");
      } finally {
        setBusy(false);
      }
    }

    async function onDelete(id) {
      if (!confirm("Delete product?")) return;
      setBusy(true);
      try {
        const res = await fetch(`${API_BASE}/${id}`, { method: "DELETE" });
        if (res.status === 404) { showMessage("Product not found", "error"); return; }
        if (!res.ok) throw new Error(`Delete failed (${res.status})`);
        showMessage("Product deleted");
        await fetchProducts();
        if (idEl.value == id) resetForm();
      } catch (err) {
        showMessage(`Delete error: ${err.message}`, "error");
      } finally {
        setBusy(false);
      }
    }

    function validate(payload) {
      if (!payload.name || payload.name.trim().length < 1) return "Name is required";
      if (!payload.sku || payload.sku.trim().length < 1) return "SKU is required";
      if (isNaN(payload.price) || payload.price < 0) return "Price must be >= 0";
      if (!Number.isInteger(payload.stock) || payload.stock < 0) return "Stock must be integer >= 0";
      return null;
    }

    async function onSubmit(e) {
      e.preventDefault();
      const payload = {
        name: nameEl.value.trim(),
        sku: skuEl.value.trim(),
        price: parseFloat(priceEl.value),
        stock: parseInt(stockEl.value || "0", 10)
      };
      const err = validate(payload);
      if (err) { showMessage(err, "error"); return; }
      setBusy(true);
      try {
        const id = idEl.value;
        const url = id ? `${API_BASE}/${id}` : API_BASE;
        const method = id ? "PUT" : "POST";
        const res = await fetch(url, {
          method,
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload)
        });
        if (res.status === 400) {
          const body = await res.json().catch(()=>({error: "Validation error"}));
          const msg = body.error ? JSON.stringify(body.error) : "Bad request";
          showMessage(`Validation: ${msg}`, "error");
          return;
        }
        if (res.status === 404) { showMessage("Product not found", "error"); return; }
        if (!(res.status === 200 || res.status === 201)) throw new Error(`Request failed (${res.status})`);
        const data = await res.json();
        showMessage(id ? "Product updated" : "Product created");
        resetForm();
        fetchProducts();
      } catch (err) {
        showMessage(`Save error: ${err.message}`, "error");
      } finally {
        setBusy(false);
      }
    }

    function resetForm() {
      idEl.value = "";
      form.reset();
      submitBtn.textContent = "Add";
    }

    resetBtn.addEventListener("click", resetForm);
    form.addEventListener("submit", onSubmit);

    fetchProducts();
  </script>
</body>
</html>
